<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Segunda Vida - Anunciar Produto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FDF8F2] text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-[#00467F] text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">SEGUNDA VIDA</h1>
            <a href="{% url 'lista_produtos' %}" class="hover:underline">← Voltar ao Início</a>
        </div>
    </header>

    <!-- Form Container -->
    <main class="max-w-2xl mx-auto my-10 p-6 bg-white rounded-2xl shadow-lg border border-gray-100">
        <h2 class="text-2xl font-bold text-[#00467F] mb-6 text-center">Criar Novo Anúncio</h2>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block font-semibold mb-1">Título do Artigo</label>
                {{ form.titulo }}
            </div>

            <div>
                <label class="block font-semibold mb-1">Descrição</label>
                {{ form.descricao }}
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold mb-1">Preço (€)</label>
                    {{ form.preco }}
                </div>
                <div>
                    <label class="block font-semibold mb-1">Estado de Conservação</label>
                    {{ form.estado_conservacao }}
                </div>
            </div>

            <div>
                <label class="block font-semibold mb-1">Preferências de Troca</label>
                {{ form.preferencias_troca }}
            </div>

            <button type="submit" class="w-full bg-[#00467F] text-white py-3 rounded-xl font-bold hover:bg-[#003360] transition mt-6">
                Publicar Anúncio
            </button>
        </form>
    </main>

</body>
</html>
